

<!DOCTYPE html>

<html lang="bg">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AnaToLi-Manev | Галерия</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  min-height:100vh;

  background:

    linear-gradient(rgba(5,10,25,.72),rgba(5,10,25,.86)),

    url('https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=2400&q=85')

    center center / cover fixed no-repeat;

  color:white;

  font-family:Arial,sans-serif;

}

header{

  padding:25px 7%;

  border-bottom:1px solid rgba(255,255,255,.2);

  letter-spacing:3px;

  background:rgba(5,8,16,.35);

  backdrop-filter:blur(8px);

}

header span{color:#d7b778}

.hero{padding:65px 8% 35px}

small{color:#d7b778;letter-spacing:3px}

h1{font-size:clamp(38px,8vw,70px);margin:20px 0}

p{color:#ddd;line-height:1.6}

main{padding:25px 7% 80px}

button{

  background:#d7b778;

  color:#111;

  border:0;

  padding:13px 20px;

  border-radius:25px;

  font-weight:bold;

  margin:5px;

  cursor:pointer;

}

input{

  display:block;

  width:100%;

  max-width:350px;

  padding:13px;

  margin:10px 0;

  border-radius:8px;

  border:1px solid #777;

  background:rgba(20,24,35,.9);

  color:white;

}

#files{display:none}

#gallery{

  display:grid;

  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

  gap:16px;

}

.item{

  background:rgba(20,24,35,.88);

  border:1px solid rgba(255,255,255,.12);

  border-radius:12px;

  overflow:hidden;

  min-width:0;

  backdrop-filter:blur(6px);

}

.item img,.item video{

  width:100%;

  height:auto;

  display:block;

  object-fit:contain;

}

.name{padding:12px;overflow-wrap:anywhere}

#status{color:#f0cf8c;min-height:24px}

footer{

  text-align:center;

  padding:25px;

  color:#ddd;

  border-top:1px solid rgba(255,255,255,.18);

  background:rgba(5,8,16,.4);

}

[hidden]{display:none!important}

</style>

</head>

<body>

<header>ANATOLI<span> • </span>MANEV</header>

<section class="hero">

<small>PERSONAL PHOTO & VIDEO GALLERY</small>

<h1>Моменти, които остават.</h1>

<p>Добре дошли в моята публична дигитална галерия.</p>

</section>

<main>

<section id="admin">

<h2>Администраторски вход</h2>

<form id="loginForm">

<input id="email" type="email" placeholder="Имейл" required>

<input id="password" type="password" placeholder="Парола" required>

<button type="button" id="forgotBtn">Забравена парола?</button>

<button type="submit">Вход</button>

</form>

<form id="resetForm" hidden>

<h3>Задай нова парола</h3>

<p>Въведи новата си парола два пъти.</p>

<input id="newPassword" type="password" placeholder="Нова парола (поне 8 символа)" minlength="8" required>

<input id="confirmPassword" type="password" placeholder="Повтори новата парола" minlength="8" required>

<button type="submit">Запази новата парола</button>

</form>

<div id="loggedIn" hidden>

<p id="account"></p>

<button id="chooseFiles">＋ Добави снимки и видео</button>

<input id="files" type="file" accept="image/*,video/*" multiple>

<button id="logout">Изход</button>

</div>

<p id="status"></p>

</section>

<h2>Моята галерия</h2>

<div id="gallery"><p>Зареждане на галерията...</p></div>

</main>

<footer>© 2026 Anatoli Manev</footer>

<script>

const PROJECT_URL="https://hjnevciktpgrsipnblzs.supabase.co";

const PUBLISHABLE_KEY="sb_publishable_7G5kkVep_SRCbH8GlljRGg_w7WOQwdo";

const BUCKET="anatoli-photos";

const FOLDER="";

const ADMIN_ID="f16c3952-18a8-434c-a672-dc3db19916e9";

const db=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY);

const loginForm=document.getElementById("loginForm");

const resetForm=document.getElementById("resetForm");

const loggedIn=document.getElementById("loggedIn");

const statusBox=document.getElementById("status");

const gallery=document.getElementById("gallery");

const picker=document.getElementById("files");

let currentSession=null;

function message(text){

  statusBox.textContent=text;

}

function isAdmin(session){

  return !!session && session.user.id===ADMIN_ID;

}

function filePath(name){

  return FOLDER ? FOLDER+"/"+name : name;

}

function showResetForm(){

  loginForm.hidden=true;

  loggedIn.hidden=true;

  resetForm.hidden=false;

  message("Въведи новата си парола.");

}

function showSession(session){

  currentSession=session;

  if(!resetForm.hidden)return;

  loginForm.hidden=!!session;

  loggedIn.hidden=!session;

  if(session){

    document.getElementById("account").textContent=

      "Влязъл си като: "+session.user.email;

    document.getElementById("chooseFiles").hidden=!isAdmin(session);

  }

}

async function loadGallery(){

  gallery.replaceChildren();

  const {data,error}=await db.storage.from(BUCKET).list(FOLDER,{

    limit:100,

    sortBy:{column:"created_at",order:"desc"}

  });

  if(error){

    gallery.textContent="Не успяхме да заредим галерията: "+error.message;

    return;

  }

  const files=(data||[]).filter(f=>

    f.name && f.name!==".emptyFolderPlaceholder"

  );

  if(!files.length){

    gallery.textContent="Все още няма добавени снимки и видеа.";

    return;

  }

  for(const file of files){

    const fullPath=filePath(file.name);

    const url=db.storage.from(BUCKET).getPublicUrl(fullPath).data.publicUrl;

    const isVideo=/\.(mp4|webm|mov|m4v|ogg)$/i.test(file.name) ||

      (file.metadata?.mimetype||"").startsWith("video/");

    const item=document.createElement("div");

    item.className="item";

    const media=document.createElement(isVideo?"video":"img");

    media.src=url;

    if(isVideo){

      media.controls=true;

      media.preload="metadata";

    }else{

      media.loading="lazy";

      media.alt=file.name;

    }

    media.onerror=()=>{

      const errorText=document.createElement("p");

      errorText.textContent="Файлът не може да се зареди: "+file.name;

      item.append(errorText);

    };

    const name=document.createElement("div");

    name.className="name";

    name.textContent=file.name;

    item.append(media,name);

    if(isAdmin(currentSession)){

      const deleteButton=document.createElement("button");

      deleteButton.textContent="Изтрий";

      deleteButton.addEventListener("click",async()=>{

        if(!confirm("Сигурен ли си, че искаш да изтриеш този файл?"))return;

        const {error}=await db.storage.from(BUCKET).remove([fullPath]);

        if(error){

          message("Грешка при изтриване: "+error.message);

          return;

        }

        message("Файлът е изтрит.");

        await loadGallery();

      });

      item.append(deleteButton);

    }

    gallery.append(item);

  }

}

document.getElementById("forgotBtn").addEventListener("click",async()=>{

  const email=document.getElementById("email").value.trim();

  if(!email){

    message("Първо въведи имейла си.");

    return;

  }

  message("Изпращане на линк...");

  const {error}=await db.auth.resetPasswordForEmail(email,{

    redirectTo:window.location.origin+window.location.pathname

  });

  if(error){

    message("Грешка: "+error.message);

  }else{

    message("Провери имейла си за линк за възстановяване.");

  }

});

loginForm.addEventListener("submit",async(e)=>{

  e.preventDefault();

  message("Проверка на входа...");

  const {data,error}=await db.auth.signInWithPassword({

    email:document.getElementById("email").value,

    password:document.getElementById("password").value

  });

  if(error){

    message("Грешка при вход: "+error.message);

    return;

  }

  showSession(data.session);

  message("Успешен вход!");

  await loadGallery();

});

resetForm.addEventListener("submit",async(e)=>{

  e.preventDefault();

  const password=document.getElementById("newPassword").value;

  const confirmPassword=document.getElementById("confirmPassword").value;

  if(password.length<8){

    message("Паролата трябва да е поне 8 символа.");

    return;

  }

  if(password!==confirmPassword){

    message("Паролите не съвпадат.");

    return;

  }

  message("Запазване на новата парола...");

  const {error}=await db.auth.updateUser({password});

  if(error){

    message("Грешка: "+error.message);

    return;

  }

  resetForm.hidden=true;

  loginForm.hidden=false;

  document.getElementById("password").value="";

  document.getElementById("newPassword").value="";

  document.getElementById("confirmPassword").value="";

  await db.auth.signOut();

  message("Паролата е сменена успешно. Влез с новата парола.");

});

document.getElementById("logout").addEventListener("click",async()=>{

  await db.auth.signOut();

  message("Излезе от профила.");

});

document.getElementById("chooseFiles").addEventListener("click",()=>{

  picker.click();

});

picker.addEventListener("change",async()=>{

  if(!isAdmin(currentSession)){

    message("Нямаш права за качване.");

    return;

  }

  const selected=Array.from(picker.files||[]);

  if(!selected.length)return;

  for(const file of selected){

    if(!file.type.startsWith("image/")&&!file.type.startsWith("video/")){

      message("Пропуснат неподдържан файл: "+file.name);

      continue;

    }

    const safeName=file.name.replace(/[^a-zA-Z0-9._-]+/g,"-");

    const path=filePath(Date.now()+"-"+Math.random().toString(36).slice(2)+"-"+safeName);

    message("Качване: "+file.name);

    const {error}=await db.storage.from(BUCKET).upload(path,file,{

      contentType:file.type,

      upsert:false

    });

    if(error){

      message("Грешка при качване: "+error.message);

      return;

    }

  }

  picker.value="";

  message("Качването приключи успешно!");

  await loadGallery();

});

db.auth.onAuthStateChange((event,session)=>{

  if(event==="PASSWORD_RECOVERY"){

    showResetForm();

    return;

  }

  showSession(session);

  loadGallery();

});

db.auth.getSession().then(({data})=>{

  showSession(data.session);

  loadGallery();

});

</script>

</body>

</html>
